name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    # Di-pin ke 24.04 agar tidak terdampak migrasi ubuntu-latest -> Ubuntu 26
    # (mulai 19 Okt 2026). Naikkan versi secara sadar setelah diverifikasi.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # phpunit.xml memaksa SQLite :memory: + cache/session array,
      # jadi job ini cukup .env + APP_KEY (tanpa setup DB).
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Anotasi kegagalan ke GitHub Checks agar detail error terlihat
      # tanpa harus membuka log job (yang butuh autentikasi).
      - name: Run test suite
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test.log

      - name: Annotate test failures
        if: failure()
        run: |
          if [ -f test.log ]; then
            msg=$(tail -n 40 test.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::PHPUnit failures (tail): ${msg}"
          fi

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      # E2E memakai SQLite file + APP_URL yang sama dengan baseURL Playwright
      # (http://127.0.0.1:8000) supaya URL aset build/Vite mengarah ke server uji.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          touch database/database.sqlite

      - name: Setup database
        run: php artisan migrate:fresh --seed

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server
        run: nohup php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat storage/logs/serve.log
          exit 1

      - name: Run E2E tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Annotate E2E failures
        if: failure()
        run: |
          if [ -f e2e.log ]; then
            msg=$(tail -n 40 e2e.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Playwright failures (tail): ${msg}"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
